name: Dendoparque

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  test:
    env:
      PGPASSWORD : '1234567890'
      PGDATABASE : 'Дендропарк'
      PGUSER : 'Географ'
      PGPORT : '5432'
      PGHOST : '127.0.0.1'
      pg_ver : '18'

    name: Разворачивание PostgreSQL, загрузка данных
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tar
        run: |
          chmod +x ./test/*.sh -v

      - name: Установка PostgreSQL, библиотек для компиляции утилиты, местных стандартов вывода
        run: |
          sudo apt install -y apt-transport-https zip
          sudo apt install postgresql-${{ env.pg_ver }} postgresql-${{ env.pg_ver }}-http postgresql-${{ env.pg_ver }}-semver postgresql-${{ env.pg_ver }}-postgis-3 osmium-tool -y
          sudo apt install language-pack-ru-base language-pack-ru -y && sudo locale-gen ru_RU
          sudo systemctl restart postgresql;

      - name: Компиляция unzip
        run: |
          sudo sudo apt install -y libzip-dev pkg-config;
          sudo apt install -y postgresql-common;
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y;
          sudo apt update;
          sudo apt install postgresql-server-dev-18 postgresql-client-18;
          ./pg_c_unzip/sys_compile.sh;

      - name: Компиляция pghtmltable
        run: |
          sudo apt install libpq-dev pkg-config
          (cd pghtmltable; ./compile.sh;)

      - name: Подготовка пользователя и БД PostgreSQL
        run: bash test/db_init.sh '${{ env.PGDATABASE }}' '${{ env.PGUSER }}' '${{ env.PGPASSWORD }}';

      - name: Загрузка постоянных данных из документации
        run: bash test/load_static.sh;

      - name: Загрузка данных OSM
        run: bash test/load_osm.sh;

      - name: Загрузка прочих данных
        run: bash test/load.sh;

      - name: Проверка итогового запроса
        run: bash test/control.sh ${{ env.test_schema }}

      - name: Скачивание артефактов провала для анализа
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diff_schema_${{ env.test_schema }}
          path: |
            test/
          retention-days: 4
